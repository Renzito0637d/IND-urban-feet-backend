spring.application.name=${SPRING_APPLICATION_NAME:urbanfeet}

# Configuración de Base de Datos (PostgreSQL / Supabase)
# Permite definir la URL completa con DB_URL o componentes individuales
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# Optimización de Conexiones HikariCP para bajo consumo de memoria (Render Free Tier)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# Configuración de JPA / Hibernate (PostgreSQL)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Configuración del Servidor

server.port=${PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:native}

# Configuración de Seguridad y JWT

security.jwt.secret=${JWT_SECRET:oW0Kea2JChJrKdZU3lHA4spbxKBY98mfcQJxBCbgvHo=}
security.jwt.access-exp-seconds=${JWT_ACCESS_EXP_SECONDS:3600}
security.jwt.exp-seconds=${JWT_EXP_SECONDS:3600}
security.jwt.refresh-exp-seconds=${JWT_REFRESH_EXP_SECONDS:604800}

# Configuración de Cookies
app.cookies.secure=${COOKIES_SECURE:false}
app.cookies.domain=${COOKIES_DOMAIN:}
app.cookies.samesite=${COOKIES_SAMESITE:Lax}

# Logging
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:DEBUG}
